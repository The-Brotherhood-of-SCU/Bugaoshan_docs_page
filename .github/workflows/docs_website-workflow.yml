name: Documentation Site

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/docs_website-workflow.yml"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/docs_website-workflow.yml"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  # required for peaceiris/actions-gh-pages
  contents: write

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "./docs/pnpm-lock.yaml"

      - name: Install node modules
        run: pnpm install --frozen-lockfile
        working-directory: "./docs"

      - name: Build
        run: pnpm run build
        working-directory: "./docs"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        # 主仓库 push 自动部署；fork 里可手动触发（workflow_dispatch）部署用于测试
        if: github.repository == 'The-Brotherhood-of-SCU/Bugaoshan' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./docs/.vuepress/dist"
          publish_branch: gh-pages
