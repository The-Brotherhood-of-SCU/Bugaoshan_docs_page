name: Documentation Site

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
  pull_request:
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  # GitHub Pages 官方部署（actions/deploy-pages）所需权限
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "./docs/pnpm-lock.yaml"

      - name: Install node modules
        run: pnpm install --frozen-lockfile
        working-directory: "./docs"

      - name: Build
        run: pnpm run build
        working-directory: "./docs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/.vuepress/dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # 主仓库 main 分支 push 自动部署；fork 里可手动触发（workflow_dispatch）部署用于测试
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'The-Brotherhood-of-SCU/Bugaoshan_docs_page') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
