name: Update Website Changelog

on:
  schedule:
    - cron: '0 2 * * *'          # 每天 UTC 2:00 自动运行
  workflow_dispatch:
    inputs:
      source_repo:
        description: '要跟踪的仓库（格式：owner/repo）'
        required: true
        default: 'The-Brotherhood-of-SCU/Bugaoshan'

permissions:
  contents: write

jobs:
  update:
    name: Update changelog pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Generate changelog pages
        uses: actions/github-script@v7
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo || 'The-Brotherhood-of-SCU/Bugaoshan' }}
          SOURCE_TOKEN: ${{ secrets.PAT }}   # 必须设置具有访问源仓库权限的 PAT
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const sourceRepoInput = process.env.SOURCE_REPO || ''
            const [sourceOwner, sourceRepo] = sourceRepoInput
              ? sourceRepoInput.split('/')
              : ['The-Brotherhood-of-SCU', 'Bugaoshan']
            const sourceToken = process.env.SOURCE_TOKEN || process.env.GITHUB_TOKEN

            const CHANGELOG_DIR = 'docs_website/changelog'

            function versionKey(tag) {
              const base = tag.replace(/^v/, '')
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(base)
              if (!m) return [0, 0, 0, 1, base]
              const pre = m[4]
              return [+m[1], +m[2], +m[3], pre ? 1 : 0, pre || '']
            }

            function renderPage(entry, order) {
              const tag = entry.tag
              const title = tag.startsWith('v') ? tag : `v${tag}`
              const dateLine = entry.date ? `- 发布日期：${entry.date}` : ''
              const content = entry.body ? entry.body.trimEnd() + '\n' : '*暂无此版本的更新日志。*\n'
              return `---
            title: ${title}
            icon: mdi:history
            order: ${order}
            ---

            # ${title}

            ${dateLine}

            ${content}
            `
            }

            function renderIndex(entries) {
              const lines = [
                '---', 'title: 更新日志', 'icon: mdi:history',
                'dir:', '  order: 2', '---', '',
                '# 更新日志', '',
                '本栏目按版本记录不高山上的功能更新与修复。内容随 GitHub Release 自动更新。',
                '', '## 版本记录', '',
              ]
              entries.forEach((e, i) => {
                const title = e.tag.startsWith('v') ? e.tag : `v${e.tag}`
                const date = e.date ? `（${e.date}）` : ''
                lines.push(`${i + 1}. [${title}](./${e.tag}.md)${date}`)
              })
              lines.push('')
              return lines.join('\n')
            }

            function stripTocHeadings(body) {
              if (!body) return '*暂无此版本的更新日志。*\n'
              return body
                .split('\n')
                .map(line => {
                  if (/^#{1,3}\s+/.test(line)) return `**${line.replace(/^#{1,3}\s+/, '')}**`
                  return line
                })
                .join('\n')
                .trimEnd() + '\n'
            }

            // 从指定仓库拉取 releases
            let entries = null
            try {
              const octokit = github.getOctokit(sourceToken)
              const releases = await octokit.paginate(octokit.rest.repos.listReleases, {
                owner: sourceOwner,
                repo: sourceRepo,
                per_page: 100,
              })
              entries = releases
                .map(r => ({
                  tag: (r.tag_name || '').replace(/^v/, ''),
                  date: (r.published_at || '').slice(0, 10),
                  body: (r.body || '').trim(),
                }))
                .filter(e => e.tag)
              console.log(`从 ${sourceOwner}/${sourceRepo} 拉取到 ${entries.length} 个 release`)
            } catch (err) {
              console.log(`GitHub API 拉取失败（${err.message}）`)
            }

            if (!entries || entries.length === 0) {
              core.setFailed(`未能从 ${sourceOwner}/${sourceRepo} 获取任何 release，请检查仓库是否存在及 token 权限。`)
              return
            }

            entries.sort((a, b) => {
              const ka = versionKey(a.tag)
              const kb = versionKey(b.tag)
              for (let i = 0; i < ka.length; i++) {
                if (ka[i] !== kb[i]) return ka[i] < kb[i] ? 1 : -1
              }
              return 0
            })

            // 写入各版本页面 + 索引 + 最新版
            fs.mkdirSync(CHANGELOG_DIR, { recursive: true })
            entries.forEach((e, i) => {
              const p = path.join(CHANGELOG_DIR, `${e.tag}.md`)
              fs.writeFileSync(p, renderPage(e, i + 1))
            })
            fs.writeFileSync(path.join(CHANGELOG_DIR, 'README.md'), renderIndex(entries))

            const latest = entries[0]
            const latestTitle = latest.tag.startsWith('v') ? latest.tag : `v${latest.tag}`
            const latestBody = stripTocHeadings(latest.body)
            fs.writeFileSync(
              path.join(CHANGELOG_DIR, '_latest.md'),
              `**当前版本：${latestTitle}**\n\n${latestBody}`,
            )
            console.log(`✍ 已生成 ${entries.length} 个版本页面，最新版 ${latest.tag}`)

      - name: Commit & push changelog (safety net)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No website changelog changes to commit."
          else
            git add docs_website/changelog/
            git commit -m "chore: update website changelog from releases of ${SOURCE_REPO:-The-Brotherhood-of-SCU/Bugaoshan}"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "rebase failed, continuing"; }
            git push origin HEAD:main || echo "safety-net push failed (main moved on), continuing"
          fi
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo || 'The-Brotherhood-of-SCU/Bugaoshan' }}